[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autodirector"
version = "0.1.0"
description = "Church Auto-Director: ATEM multiview ingest, CV, and rule-based live switching."
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8.0,<5.0",
    "numpy>=1.24.0,<3.0",
    "ultralytics>=8.2.0",
    "PyATEMMax>=1.0b9",
    "python-osc>=1.8.0",
    "websocket-client>=1.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
autodirector = "run_director:main"

